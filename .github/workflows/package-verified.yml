name: Package verified Lucy Builder
on:
  workflow_dispatch:
  push:
    branches: [codex/lucy-builder-2026-11-09]
    paths: ['.github/workflows/package-verified.yml']
permissions:
  contents: read
jobs:
  ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Flatpak and SVG support
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak librsvg2-common
      - name: Download verified source and Android artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p deliverables
          gh api repos/PedroGuille/ArtCraft-Android/actions/artifacts/13698600682/zip > "$RUNNER_TEMP/prepared-source.zip"
          gh api repos/PedroGuille/ArtCraft-Android/actions/artifacts/13698967186/zip > deliverables/CADCraft-Tablet-0.17.0-arm64-v8a.apk
          gh api repos/PedroGuille/ArtCraft-Android/actions/artifacts/13699192401/zip > deliverables/Lucy-WordCraft-PDFcraft-GridCraft.apk
      - name: Verify bytes and restore reviewed sources
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, zipfile
          root=pathlib.Path('deliverables')
          files=[
              (pathlib.Path(os.environ['RUNNER_TEMP'])/'prepared-source.zip','5394210b59c783aacb1eb20df1fecd0aaa565e35549484b49bf095c6ce1d8e5b'),
              (root/'CADCraft-Tablet-0.17.0-arm64-v8a.apk','a1dcdcb1e1dc44a768abd83720643746c321c6cc75d9405ac75723bc33ecf908'),
              (root/'Lucy-WordCraft-PDFcraft-GridCraft.apk','569e09d06aff83dfa4772f5f1aef83925c59300688e6e3af58ebbe47a697c5b8'),
          ]
          for path,digest in files:
              if hashlib.sha256(path.read_bytes()).hexdigest()!=digest:raise SystemExit('Artifact digest differs: '+path.name)
          with zipfile.ZipFile(files[0][0]) as archive:
              patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed-source.patch'
              patch.write_bytes(archive.read('constructor-source-update.patch'))
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          PY
      - name: Package constructor and checksums
        run: python3 -u tools/current_sources.py package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: deliverables/Lucy-Builder-2.3.0-x86_64.flatpak
          archive: false
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-update
          path: deliverables/constructor-source-update.patch
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: deliverables/SHA256SUMS.txt
          archive: false
          retention-days: 7
          if-no-files-found: error
