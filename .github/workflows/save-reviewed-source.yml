name: Save reviewed Lucy Builder sources
on:
  push:
    branches: [codex/lucy-builder-2026-11-09]
    paths: ['.github/workflows/save-reviewed-source.yml']
permissions:
  contents: write
jobs:
  ready:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download reviewed source update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/PedroGuille/ArtCraft-Android/actions/artifacts/13698234110/zip > "$RUNNER_TEMP/source-update.zip"
      - name: Verify and apply reviewed source update
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess, zipfile
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'source-update.zip'
          if hashlib.sha256(source.read_bytes()).hexdigest()!='1dc1daf6dee3598c713822141e59775e5fad58face165acca18569eeb3d1aab3':
              raise SystemExit('Source update digest differs')
          with zipfile.ZipFile(source) as archive:
              patch=source.with_suffix('.patch')
              patch.write_bytes(archive.read('constructor-source-update.patch'))
          subprocess.run(['git','apply','--index',str(patch)],check=True)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          allowed={'app','engine','native-cad','tests','flatpak'}
          root={'README.md','build_flatpak.py','release_source.py','VALIDACION-2.3.0.md'}
          for name in filter(None,paths):
              p=pathlib.PurePosixPath(name)
              if (p.parts[0] not in allowed and name not in root) or p.suffix in {'.p12','.pfx','.jks','.keystore','.apk'}:
                  raise SystemExit('Refusing unexpected source path: '+name)
          PY
          git diff --cached --check
      - name: Save current-source constructor on review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Lucy Builder 2.3.0 for reviewed current office and native CAD sources'
          git push origin HEAD:refs/heads/codex/lucy-builder-2026-11-09
