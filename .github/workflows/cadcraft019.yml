name: CADCraft 0.19 and Lucy Builder
on:
  workflow_dispatch:
  push:
    branches: [codex/cadcraft-0.19]
    paths:
      - '.github/workflows/cadcraft019.yml'
      - 'tools/upgrade_cad019.py'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.persist.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak librsvg2-common
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Adapt and verify the published CADCraft 0.19 sources
        run: python3 -u tools/upgrade_cad019.py
      - name: Check constructor regressions
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s engine/tests -p 'test_*.py'
          python3 -m unittest discover -s native-cad/tests -p 'test_*.py'
          node tests/reading_menu.cjs
      - name: Check Flatpak packaging before native compilation
        run: python3 build_flatpak.py --output "$RUNNER_TEMP/flatpak-check"
      - name: Preserve reviewed code before compilation
        id: persist
        run: |
          git add app engine native-cad flatpak README.md build_flatpak.py release_source.py tools/current_sources.py VALIDACION-2.3.1.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Support native CADCraft 0.19.0 builds in Lucy Builder 2.3.1'
            git push origin HEAD:refs/heads/codex/cadcraft-0.19
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  ready:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - name: Install packaging tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y flatpak librsvg2-common
      - name: Build and verify native CADCraft 0.19 ARM64
        run: LUCY_BUILD_PRODUCT=cad LUCY_BUILD_WORK="$RUNNER_TEMP/cad019-build" python3 -u tools/current_sources.py build
      - name: Upload signed CADCraft APK immediately
        if: always() && hashFiles('deliverables/CADCraft-Tablet-0.19.0-arm64-v8a.apk') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: deliverables/CADCraft-Tablet-0.19.0-arm64-v8a.apk
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Record validation and package Lucy Builder
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json
          spec=importlib.util.spec_from_file_location('upgrade',Path('tools/upgrade_cad019.py'))
          upgrade=importlib.util.module_from_spec(spec);spec.loader.exec_module(upgrade)
          upgrade.validation(json.loads(Path('deliverables/cadcraft-build-info.json').read_text()))
          PY
          python3 build_flatpak.py --output deliverables
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('deliverables')
          names=['CADCraft-Tablet-0.19.0-arm64-v8a.apk','Lucy-Builder-2.3.1-x86_64.flatpak']
          (root/'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root/name).read_bytes()).hexdigest()+'  '+name+'\n' for name in names))
          PY
      - name: Upload Lucy Builder 2.3.1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: deliverables/Lucy-Builder-2.3.1-x86_64.flatpak
          archive: false
          retention-days: 90
          if-no-files-found: error
      - name: Upload public validation records
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-records
          path: |
            deliverables/SHA256SUMS.txt
            deliverables/cadcraft-build-info.json
            VALIDACION-2.3.1.md
          retention-days: 90
          if-no-files-found: error
