name: Build Android preview
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: bash scripts/build_apk.sh
      - name: Inspect package and verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging build/Lucy-0.10.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/Lucy-0.10.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Lucy-Android-preview
          path: |
            build/Lucy-0.10.0.apk
            build/SHA256SUMS.txt
